<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="config.js"></script>
    <style>
      /* Dizko ID panel tokens, taken from the extension's own screens. */
      :root {
        --ground: #d9d9d3;
        --panel: #0e0e0e;
        --panel-line: #2a2a2a;
        --text: #f2f2ef;
        --muted: #9b9b96;
        --faint: #6c6c68;
        --acid: #c4f236;
        --ui: "Inter", "Helvetica Neue", Arial, sans-serif;
        --mono: "IBM Plex Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--ui); color: var(--text); }
      #stage { position: absolute; inset: 0; background: var(--ground); }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

      /* ---------- browser ---------- */
      #browser { position: absolute; left: 160px; top: 40px; width: 1600px; height: 1000px; background: #fff; border-radius: 12px; overflow: hidden;
                 box-shadow: 0 18px 40px rgba(13,13,13,.18), 0 2px 6px rgba(13,13,13,.10); }
      .toolbar { position: absolute; left: 0; top: 0; right: 0; height: 56px; background: #f1f1ee; border-bottom: 1px solid rgba(13,13,13,.12); }
      .dots { position: absolute; left: 20px; top: 21px; display: flex; gap: 8px; }
      .dots i { width: 14px; height: 14px; border-radius: 50%; background: #cfcfc7; display: block; }
      .addr { position: absolute; left: 104px; width: 1080px; top: 11px; height: 34px; border-radius: 17px; background: #fff; border: 1px solid rgba(13,13,13,.12);
              font: 400 16px/32px var(--ui); color: #45453f; padding-left: 18px; white-space: nowrap; }
      #ext { position: absolute; right: 64px; top: 12px; width: 32px; height: 32px; border-radius: 8px; }
      #ext img { position: absolute; left: 4px; top: 7px; width: 24px; }
      #ext .on { position: absolute; inset: 0; border-radius: 8px; background: rgba(13,13,13,.10); opacity: 0; }
      .tb-more { position: absolute; right: 24px; top: 18px; width: 4px; height: 20px; background: radial-gradient(circle, #6f6f68 2px, transparent 2.5px) 0 0 / 4px 7px; }
      .page { position: absolute; left: 0; top: 56px; right: 0; bottom: 0; background: #fff; color: #0d0d0d; }

      /* mix page: an unbranded SoundCloud-style track page */
      .sc-top { height: 56px; border-bottom: 1px solid rgba(13,13,13,.1); display: flex; align-items: center; gap: 28px; padding: 0 40px; font: 500 16px var(--ui); color: #6f6f68; }
      .sc-hero { position: absolute; left: 40px; width: 980px; top: 88px; height: 360px; background: #1a1a18; border-radius: 8px; overflow: hidden; }
      .sc-play { position: absolute; left: 30px; top: 30px; width: 64px; height: 64px; border-radius: 50%; background: #f2f2ef; }
      .sc-play i { position: absolute; display: block; top: 20px; width: 7px; height: 24px; background: #1a1a18; }
      .sc-meta { position: absolute; left: 112px; top: 28px; color: #f2f2ef; }
      .sc-meta .a { font: 500 19px var(--ui); opacity: .7; }
      .sc-meta .t { font: 700 32px/1.2 var(--ui); margin-top: 6px; letter-spacing: -0.015em; }
      .sc-meta .g { font: 500 16px var(--ui); opacity: .6; margin-top: 8px; }
      .sc-art { position: absolute; right: 28px; top: 28px; width: 220px; height: 220px;
                background: repeating-linear-gradient(90deg, #c4f236 0 18px, #a9d22a 18px 26px, #c4f236 26px 44px, #1a1a18 44px 47px); }
      .wave { position: absolute; left: 30px; right: 30px; bottom: 50px; height: 96px; }
      .wave .bars, .wave .played { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
      .wave b { flex: 1; background: rgba(242,242,239,.32); display: block; }
      .wave .played b { background: #f2f2ef; }
      .wave .time { position: absolute; bottom: -30px; font: 500 15px var(--ui); color: rgba(242,242,239,.7); }
      .sc-body { position: absolute; left: 40px; width: 980px; top: 476px; font: 400 17px/1.5 var(--ui); color: #45453f; }
      .sc-body .row { display: flex; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid rgba(13,13,13,.1); }
      .sc-body .btn { height: 34px; padding: 0 14px; border: 1px solid rgba(13,13,13,.16); border-radius: 4px; font: 500 15px/32px var(--ui); }
      .sc-body p { margin-top: 18px; }
      .sc-side { position: absolute; left: 1060px; right: 40px; top: 88px; }
      .sc-side .h { font: 600 16px var(--ui); color: #6f6f68; margin-bottom: 14px; }
      .sc-side .it { height: 72px; display: flex; gap: 14px; align-items: center; }
      .sc-side .it i { width: 56px; height: 56px; background: #e4e4df; display: block; }
      .sc-side .it b { display: block; width: 260px; height: 12px; background: #ececE6; }

      /* ---------- Dizko ID side panel ---------- */
      #panel { position: absolute; top: 56px; right: 0; width: 540px; bottom: 0; background: var(--panel); border-left: 1px solid #000; overflow: hidden; }
      .p-head { position: absolute; left: 0; right: 0; top: 0; height: 52px; border-bottom: 1px solid var(--panel-line); background: var(--panel); z-index: 2; }
      .p-head img { position: absolute; left: 10px; top: 14px; width: 30px; filter: invert(1); }
      .p-head .nm { position: absolute; left: 47px; top: 13px; font: 600 18.5px/26px var(--ui); letter-spacing: -0.01em; }
      .p-head .gear { position: absolute; right: 12px; top: 14px; width: 24px; height: 24px; }
      #pbody { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; overflow: hidden; }
      #pc { position: absolute; left: 0; right: 0; top: 0; height: 1300px; }
      .pa { position: absolute; white-space: nowrap; }
      .hr { position: absolute; left: 0; right: 0; height: 1px; background: var(--panel-line); }
      .hr.in { left: 10px; right: 10px; }
      .t-lib { font: 500 16px var(--ui); }
      .t-art { font: 700 25px var(--ui); letter-spacing: -0.02em; }
      .t-meta { font: 400 14px var(--ui); color: var(--muted); }
      .t-date { font: 600 14px var(--ui); }
      .t-ev { font: 600 14px var(--ui); }
      .t-more { font: 600 13px var(--ui); color: var(--muted); }
      .t-mix { font: 600 17px var(--ui); letter-spacing: -0.01em; }
      .t-wait { font: 500 15px var(--ui); }
      .t-pct { font: 600 18px var(--ui); }
      .bar { position: absolute; left: 10px; right: 10px; height: 6px; border-radius: 3px; background: #2e2e2c; overflow: hidden; }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--acid); transform-origin: 0 0; }
      .pill { position: absolute; border-radius: 999px; text-align: center; font: 600 15px var(--ui); border: 1px solid #bdbdb8; color: var(--text); }
      .pill.pri { background: var(--acid); color: #0e0e0e; border-color: var(--acid); }
      .t-tick { font: 400 14px var(--ui); color: var(--muted); }
      .t-act { font: 500 14px var(--ui); }
      .trk { position: absolute; left: 10px; right: 10px; }
      .cb { position: absolute; left: 0; top: 14px; width: 17px; height: 17px; border-radius: 3px; border: 1.5px solid #8a8a86; }
      .cb.on { background: var(--acid); border-color: var(--acid); }
      .cbon { position: absolute; left: -1.5px; top: -1.5px; width: 17px; height: 17px; border-radius: 3px; background: var(--acid); opacity: 0; }
      .cb svg { position: absolute; left: 1px; top: 1px; width: 12px; height: 12px; }
      .r-time { position: absolute; left: 30px; top: 12px; font: 500 13px var(--ui); color: var(--muted); }
      .r-art { position: absolute; left: 88px; top: 12px; font: 600 13px var(--ui); color: var(--muted); }
      .r-tt { position: absolute; left: 88px; top: 30px; font: 600 18.5px var(--ui); letter-spacing: -0.01em; }
      .trk.unc .r-tt { font-weight: 500; font-size: 16.5px; top: 31px; }
      .play { position: absolute; left: 38px; top: 38px; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #5f5f5b; }
      .play .tri { position: absolute; left: 10px; top: 7.5px; width: 0; height: 0; border-left: 10px solid #f2f2ef; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
      .play .ps { position: absolute; top: 8.5px; width: 3px; height: 10px; background: #f2f2ef; opacity: 0; }
      .links { position: absolute; left: 88px; top: 63px; display: flex; gap: 12px; font: 500 12.5px var(--ui); color: #e8e8e4; }
      .links span { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #8a8a86; }
      .t-plus { font: 600 16px var(--ui); }
      .t-sub { font: 400 13px var(--ui); color: var(--muted); }

      /* ---------- cursor ---------- */
      #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 34px; opacity: 0; z-index: 20; }

      /* ---------- overlays (not moved by the camera) ---------- */
      .cap { position: absolute; left: 72px; bottom: 72px; padding: 13px 24px 15px; background: var(--panel); color: var(--text);
             border-radius: 10px; font: 600 52px/1.1 var(--ui); letter-spacing: -0.025em; opacity: 0; z-index: 30; white-space: nowrap; }
      .cap.side { bottom: auto; top: 420px; }
      .cap .w { display: inline-block; }
      .cap .acc { color: var(--acid); }
      #disc { position: absolute; left: 76px; bottom: 30px; font: 500 19px var(--ui); color: #45453f; z-index: 30; }
      #endcard { position: absolute; inset: 0; z-index: 40; background: var(--panel); opacity: 0; }
      #lockup { position: absolute; left: 0; right: 0; top: 432px; display: flex; justify-content: center; align-items: center; gap: 30px; }
      #mark { width: 170px; height: 132px; }
      #mark img { width: 100%; height: 100%; display: block; filter: invert(1); }
      #word { font: 600 112px/1 var(--ui); letter-spacing: -0.03em; color: var(--text); }
      #cta { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 500 30px var(--ui); color: var(--text); opacity: 0; }
      #enddisc { position: absolute; left: 0; right: 0; top: 694px; text-align: center; font: 500 22px var(--ui); color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.6" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="22.6" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="cam">
          <div id="browser">
            <div class="toolbar">
              <div class="dots"><i></i><i></i><i></i></div>
              <div class="addr" id="addr"></div>
              <div id="ext"><div class="on" id="ext-on"></div><img src="assets/brand/dizko-mark-only.svg" alt="" /></div>
              <div class="tb-more"></div>
            </div>
            <div class="page" id="pg-mix"></div>
            <div id="panel">
              <div class="p-head">
                <img src="assets/brand/dizko-mark-only.svg" alt="" />
                <div class="nm">Dizko ID</div>
                <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#9b9b96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
              </div>
              <div id="pbody"><div id="pc"></div></div>
            </div>
          </div>
          <svg id="cursor" viewBox="0 0 26 34" aria-hidden="true">
            <path d="M2.5 2 L2.5 26 L8.5 20.5 L12.6 30.6 L17.2 28.7 L13 18.8 L21.3 18.8 Z" fill="#0d0d0d" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </div>
        <div id="caps"></div>
        <div id="disc"></div>
        <div id="endcard">
          <div id="lockup">
            <div id="mark"><img src="assets/brand/dizko-mark-only.svg" alt="" /></div>
            <div id="word">Dizko ID</div>
          </div>
          <div id="cta"></div>
          <div id="enddisc"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const C = window.DIZKO_DEMO;
        const T = C.timing;
        const $ = (s) => document.querySelector(s);
        const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

        // World geometry (px before the camera). Constants, so the cursor and camera
        // never measure layout while rendering.
        const BROWSER = { x: 160, y: 40, w: 1600, h: 1000 };
        const PANEL = { x: BROWSER.x + BROWSER.w - 540, w: 540 };
        const BODY_Y = BROWSER.y + 56 + 52; // top of the panel's scrolling body
        const PAD = 10;

        // ---------- mix page ----------
        $("#addr").textContent = C.mix.url;
        const bars = Array.from({ length: 160 }, (_, i) => {
          const h = 16 + 70 * Math.abs(Math.sin(i * 0.41) * Math.cos(i * 0.097)) + 12 * Math.abs(Math.sin(i * 1.7));
          return `<b style="height:${h.toFixed(1)}%"></b>`;
        }).join("");
        $("#pg-mix").innerHTML = `
          <div class="sc-top"><span>Home</span><span>Feed</span><span>Library</span></div>
          <div class="sc-hero">
            <div class="sc-play"><i style="left:21px"></i><i style="left:36px"></i></div>
            <div class="sc-meta"><div class="a">${esc(C.mix.uploader)}</div><div class="t">${esc(C.mix.title)}</div><div class="g"># ${esc(C.mix.genre)}</div></div>
            <div class="sc-art"></div>
            <div class="wave"><div class="bars">${bars}</div><div class="played" id="played">${bars}</div>
              <div class="time" style="left:0" id="wtime"></div><div class="time" style="right:0">${esc(C.mix.length)}</div></div>
          </div>
          <div class="sc-body"><div class="row"><span class="btn">Like</span><span class="btn">Repost</span><span class="btn">Share</span><span class="btn">Copy link</span></div>
            <p>Sample mix made for this demo.</p></div>
          <div class="sc-side"><div class="h">Related tracks</div>${'<div class="it"><i></i><b></b></div>'.repeat(5)}</div>`;

        // ---------- Dizko ID panel content (positions in panel-body px) ----------
        const pc = $("#pc");
        const put = (html, x, y, cls, extra = "") => { pc.insertAdjacentHTML("beforeend", `<div class="pa ${cls}" style="left:${x}px;top:${y}px;${extra}">${html}</div>`); return pc.lastElementChild; };
        const hr = (y, inset) => pc.insertAdjacentHTML("beforeend", `<div class="hr${inset ? " in" : ""}" style="top:${y}px"></div>`);
        const A = C.artist;
        put(`<svg width="11" height="18" viewBox="0 0 11 18" style="vertical-align:-3px;margin-right:16px"><path d="M9 2 L2 9 L9 16" fill="none" stroke="#f2f2ef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Library`, PAD, 18, "t-lib");
        put(esc(A.name), PAD, 58, "t-art");
        put(esc(A.meta), PAD, 98, "t-meta");
        A.dates.forEach((d, i) => {
          const y = 134 + i * 54;
          put(esc(d.date), PAD, y, "t-date");
          put(esc(d.title), PAD + 92, y, "t-ev");
          put(esc(d.where), PAD + 92, y + 21, "t-meta");
        });
        const yMore = 134 + A.dates.length * 54 + 4;
        put(`${A.moreDates} more dates <svg width="12" height="8" viewBox="0 0 12 8" style="margin-left:6px;vertical-align:1px"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="#9b9b96" stroke-width="1.6" stroke-linecap="round"/></svg>`, PAD, yMore, "t-more");
        const yMixHr = yMore + 36; hr(yMixHr);
        put(esc(C.mix.title), PAD, yMixHr + 16, "t-mix");
        const yProgHr = yMixHr + 56; hr(yProgHr);
        put(esc(C.listening.label), PAD, yProgHr + 18, "t-wait");
        const pct = put(`${C.listening.percent[0]}%`, 0, yProgHr + 15, "t-pct", "right:10px;left:auto");
        pc.insertAdjacentHTML("beforeend", `<div class="bar" style="top:${yProgHr + 48}px"><i id="barfill"></i></div>`);
        put("Stop listening", PAD, yProgHr + 68, "pill", "width:120px;height:32px;line-height:30px;font-size:14px");
        const yBtn = yProgHr + 112;
        const confirmed = C.tracks.filter((t) => t.confident);
        let unconfirmed = C.tracks.filter((t) => !t.confident);
        const BTN_W = (540 - PAD * 2 - 8) / 2;
        const btnB = put(`Add ${confirmed.length} to Beatport`, PAD, yBtn, "pill pri", `width:${BTN_W}px;height:40px;line-height:38px`);
        const btnC = put(`Add ${confirmed.length} to Bandcamp`, PAD + BTN_W + 8, yBtn, "pill", `width:${BTN_W}px;height:40px;line-height:38px`);
        const yTickHr = yBtn + 56; hr(yTickHr);
        const total0 = C.tracks.length;
        const tickTxt = put(`${confirmed.length} of ${total0} ticked`, PAD, yTickHr + 16, "t-tick");
        put(`Export <svg width="11" height="7" viewBox="0 0 12 8" style="margin-left:4px;vertical-align:1px"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="#f2f2ef" stroke-width="1.6" stroke-linecap="round"/></svg><span style="margin-left:26px">Tick all</span>`, 0, yTickHr + 16, "t-act", "right:10px;left:auto");
        const yRows = yTickHr + 50; hr(yRows);

        const CHECK = `<svg viewBox="0 0 12 12"><path d="M2 6.3 L4.9 9 L10 3" fill="none" stroke="#0e0e0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const links = C.storeLinks.map((s) => `<span>${esc(s)}</span>`).join("");
        const row = (t, y, h, unc) => {
          pc.insertAdjacentHTML("beforeend", `<div class="trk${unc ? " unc" : ""}" style="top:${y}px;height:${h}px">
            <div class="cb${unc ? "" : " on"}">${unc ? `<div class="cbon">${CHECK}</div>` : CHECK}</div>
            <div class="r-time">${esc(t.at)}</div><div class="r-art">${esc(t.artist)}</div><div class="r-tt">${esc(t.title)}</div>
            <div class="play"><div class="tri"></div><div class="ps" style="left:8.5px"></div><div class="ps" style="left:14px"></div></div>
            <div class="links">${links}</div></div>`);
          return pc.lastElementChild;
        };
        const ROW_C = 94, ROW_U = 88;
        const rowEls = [];
        let y = yRows;
        confirmed.forEach((t) => { rowEls.push(row(t, y, ROW_C, false)); y += ROW_C; pc.insertAdjacentHTML("beforeend", `<div class="hr in" style="top:${y}px"></div>`); });
        const yPlus = y + 26;
        const plusTxt = put(`Plus ${unconfirmed.length} unconfirmed`, PAD, yPlus, "t-plus");
        hr(yPlus + 34, true);
        put("Heard only once, so they start unticked.", PAD, yPlus + 46, "t-sub");
        y = yPlus + 72;
        const uncEls = [];
        unconfirmed.forEach((t) => { const e = row(t, y, ROW_U, true); uncEls.push(e); rowEls.push(e); y += ROW_U; pc.insertAdjacentHTML("beforeend", `<div class="hr in" style="top:${y}px"></div>`); });
        const arrive = row(C.arriving, y, ROW_U, true);
        arrive.style.opacity = 0;
        const yEnd = y + ROW_U;

        // ---------- timeline ----------
        const tl = gsap.timeline({ paused: true });
        const cam = $("#cam");
        const S = 1.85;
        const camX = BROWSER.x + BROWSER.w - 900 / S; // panel's right edge lands at frame x 1860
        const view = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
        const wy = (contentY, scroll) => BODY_Y + contentY - scroll; // panel content y -> world y
        const LIST_SCROLL = Math.max(0, yEnd + 12 - 892);
        const V = {
          wide: view(BROWSER.x + BROWSER.w / 2, 540, 1.0),
          open: view(BROWSER.x + BROWSER.w / 2 + 40, 520, 1.06),
          top: view(camX, wy(0, 0) + 540 / S - 52, S),
          list: view(camX, wy(parseFloat(rowEls[C.previewTrack].style.top) - 8, LIST_SCROLL) + 540 / S, S),
          buttons: view(camX, wy(yProgHr + 2, 0) + 540 / S, S),
          head: view(PANEL.x + 80, BROWSER.y + 56 + 26, 4.2),
        };
        gsap.set(cam, V.wide);
        const move = (to, at, d = 0.7, ease = "power2.inOut") => tl.to(cam, { ...to, duration: d, ease }, at);
        const scrollTo = (s, at, d = 0.7) => tl.to("#pc", { y: -s, duration: d, ease: "power2.inOut" }, at);

        // cursor
        const cur = $("#cursor");
        gsap.set(cur, { x: 900, y: 700, transformOrigin: "2px 2px" });
        const click = (at) => tl.to(cur, { scale: 0.85, duration: 0.07, ease: "power2.in" }, at).to(cur, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.07);
        const goto = (x, y, at, d = 0.75) => tl.to(cur, { x: x - 2, y: y - 2, duration: d, ease: "power3.out" }, at);

        // 0: the mix plays
        const M = C.mix;
        const clipAt = (s) => `inset(0 ${(100 - (100 * s) / M.lengthSeconds).toFixed(2)}% 0 0)`;
        const filmEnd = C.end.at;
        tl.fromTo("#played", { clipPath: clipAt(M.startAt) }, { clipPath: clipAt(M.startAt + filmEnd), duration: filmEnd, ease: "none" }, 0);
        const fmt = (s) => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
        for (let i = 0; i <= Math.floor(filmEnd); i++) tl.set("#wtime", { textContent: fmt(M.startAt + i) }, i);

        // 1: open Dizko ID from the toolbar
        gsap.set("#panel", { x: 540 });
        move(V.open, 0.2, 2.2, "power1.inOut");
        const EXT = { x: BROWSER.x + BROWSER.w - 64 - 16, y: BROWSER.y + 28 };
        tl.to(cur, { opacity: 1, duration: 0.15 }, T.cursorToExtension);
        goto(EXT.x, EXT.y, T.cursorToExtension, 0.8);
        click(T.openPanel);
        tl.to("#ext-on", { opacity: 1, duration: 0.1 }, T.openPanel + 0.05);
        tl.to("#panel", { x: 0, duration: 0.5, ease: "expo.out" }, T.openPanel + 0.1);
        tl.fromTo(rowEls, { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.05, immediateRender: false }, T.openPanel + 0.35);
        tl.to(cur, { opacity: 0, duration: 0.2 }, T.toPanel - 0.1);
        tl.to("#pg-mix", { opacity: 0.4, duration: 0.6 }, T.toPanel);
        move(V.top, T.toPanel, 0.8);
        // listening progresses
        const P = C.listening.percent;
        gsap.set("#barfill", { scaleX: P[0] / 100 });
        P.slice(1).forEach((p, i) => {
          const at = T.toPanel + 1.2 + i * 2.4;
          tl.set(pct, { textContent: `${p}%` }, at);
          tl.to("#barfill", { scaleX: p / 100, duration: 0.6, ease: "power1.inOut" }, at - 0.3);
        });

        // 2: the tracklist; a new track arrives, heard once
        scrollTo(LIST_SCROLL, T.toList);
        move(V.list, T.toList, 0.7);
        tl.fromTo(arrive, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, T.trackArrives);
        const total = total0 + 1;
        tl.set(plusTxt, { textContent: `Plus ${unconfirmed.length + 1} unconfirmed` }, T.trackArrives);
        tl.set(tickTxt, { textContent: `${confirmed.length} of ${total} ticked` }, T.trackArrives);

        // 3: preview a match
        const pr = rowEls[C.previewTrack];
        const prY = wy(parseFloat(pr.style.top) + 38 + 14, LIST_SCROLL);
        const prX = PANEL.x + PAD + 38 + 14;
        tl.set(cur, { x: prX + 140, y: prY + 150 }, T.preview - 0.01);
        tl.to(cur, { opacity: 1, duration: 0.15 }, T.preview);
        goto(prX, prY, T.preview);
        click(T.preview + 0.85);
        goto(prX + 290, prY - 6, T.preview + 1.15, 0.6);
        tl.set(pr.querySelector(".tri"), { opacity: 0 }, T.preview + 0.9);
        tl.set(pr.querySelectorAll(".ps"), { opacity: 1 }, T.preview + 0.9);

        // 4: tick an unconfirmed track
        const tk = uncEls[C.tickUnconfirmed];
        const tkY = wy(parseFloat(tk.style.top) + 14 + 8, LIST_SCROLL);
        const tkX = PANEL.x + PAD + 8;
        goto(tkX, tkY, T.tick);
        click(T.tick + 0.8);
        const cb = tk.querySelector(".cb");
        tl.set(cb.querySelector(".cbon"), { opacity: 1 }, T.tick + 0.85);
        const n = confirmed.length + 1;
        tl.set(tickTxt, { textContent: `${n} of ${total} ticked` }, T.tick + 0.85);
        tl.set(btnB, { textContent: `Add ${n} to Beatport` }, T.tick + 0.85);
        tl.set(btnC, { textContent: `Add ${n} to Bandcamp` }, T.tick + 0.85);

        // 5: back to the add buttons, press one
        scrollTo(0, T.toButtons, 0.8);
        move(V.buttons, T.toButtons, 0.8);
        const btn = C.addTo === "Bandcamp" ? btnC : btnB;
        const bx = PANEL.x + (C.addTo === "Bandcamp" ? PAD + BTN_W + 8 : PAD) + BTN_W / 2 + 30;
        const by = wy(yBtn + 24, 0);
        goto(bx, by, T.addClick - 0.9, 0.8);
        click(T.addClick);
        tl.to(btn, { scale: 0.97, duration: 0.07, ease: "power2.in" }, T.addClick).to(btn, { scale: 1, duration: 0.14, ease: "power2.out" }, T.addClick + 0.07);

        // ---------- captions ----------
        C.captions.forEach((c) => {
          const e = document.createElement("div");
          e.className = "cap" + (c.place === "side" ? " side" : "");
          e.innerHTML = c.text.split("\n").map((line) => line.split(" ").map((w) => `<span class="w${w === c.accent ? " acc" : ""}">${esc(w)}</span>`).join(" ")).join("<br>");
          $("#caps").appendChild(e);
          tl.set(e, { opacity: 1 }, c.at);
          tl.fromTo(e.querySelectorAll(".w"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.067, ease: "power2.out", immediateRender: false }, c.at);
          tl.to(e, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, c.until - 0.2);
        });
        $("#disc").textContent = C.disclaimer;

        // ---------- end card: push into the panel's own lockup ----------
        const E = C.end;
        $("#cta").textContent = E.cta;
        $("#enddisc").textContent = C.disclaimer;
        tl.to(cur, { opacity: 0, duration: 0.2 }, E.at - 0.6);
        move(V.head, E.at - 0.6, 0.7, "power3.in");
        tl.to("#disc", { opacity: 0, duration: 0.2 }, E.at - 0.4);
        tl.to("#endcard", { opacity: 1, duration: 0.3, ease: "power2.out" }, E.at);
        tl.fromTo("#lockup", { scale: 1.12 }, { scale: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, E.at);
        tl.to("#cta", { opacity: 1, duration: 0.3 }, E.at + 0.7);
        tl.to("#enddisc", { opacity: 1, duration: 0.3 }, E.at + 0.85);
        tl.set({}, {}, E.at + E.hold);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
